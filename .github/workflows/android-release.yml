name: AYRA AI Android Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      custom_tag:
        description: 'Custom version tag (optional, e.g. v1.0.5). Leave empty for auto-increment.'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build & Publish Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Latest Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22 Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          npm ci

      - name: Compile Fresh AYRA AI Web Assets
        run: |
          npm run build
          mkdir -p app/src/main/assets/public
          cp -r dist/* app/src/main/assets/public/
          cp -r dist/* app/src/main/assets/

      - name: Install uploaded Hatsune Miku 3D model
        run: |
          mkdir -p /tmp/ayra-model public/assets/ayra dist/assets/ayra
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/ahmadaslam42429-creator/Maya-Ai/releases/download/v1.0.10/hatsune-miku-vocaloid-t-pose-3d-model.zip" \
            --output /tmp/ayra-model/avatar.zip
          unzip -p /tmp/ayra-model/avatar.zip source/ip-vocaloid__hatsune-miku__concept__tpose.glb > dist/assets/ayra/hatsune-miku.glb
          test -s dist/assets/ayra/hatsune-miku.glb
          cp dist/assets/ayra/hatsune-miku.glb app/src/main/assets/public/assets/ayra/hatsune-miku.glb
          cp dist/assets/ayra/hatsune-miku.glb app/src/main/assets/assets/ayra/hatsune-miku.glb
          echo "Installed uploaded GLB avatar ($(stat -c%s dist/assets/ayra/hatsune-miku.glb) bytes)"

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Clean & Build Android Release APK with Gradle
        run: |
          ./gradlew clean assembleRelease assembleDebug --stacktrace --no-daemon --rerun-tasks

      - name: Locate, Verify & Package AYRA-AI.apk
        id: verify_apk
        run: |
          mkdir -p build-artifacts
          
          # Prioritize release APK
          if [ -f "app/build/outputs/apk/release/AYRA-AI.apk" ]; then
            TARGET_APK="app/build/outputs/apk/release/AYRA-AI.apk"
          elif [ -f "app/build/outputs/apk/release/AYRA-AI-release.apk" ]; then
            TARGET_APK="app/build/outputs/apk/release/AYRA-AI-release.apk"
          else
            TARGET_APK=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          fi

          # Fallback to debug APK if release variant was not generated
          if [ -z "$TARGET_APK" ] || [ ! -f "$TARGET_APK" ]; then
            TARGET_APK=$(find app/build/outputs/apk -name "*debug.apk" 2>/dev/null | head -n 1)
          fi

          if [ -z "$TARGET_APK" ] || [ ! -f "$TARGET_APK" ]; then
            echo "::error::No Android APK found after Gradle build!"
            exit 1
          fi

          # Verify file size is healthy (> 100KB)
          FILESIZE=$(stat -c%s "$TARGET_APK" 2>/dev/null || stat -f%z "$TARGET_APK" 2>/dev/null)
          if [ "$FILESIZE" -lt 100000 ]; then
            echo "::error::Generated APK is too small ($FILESIZE bytes)!"
            exit 1
          fi

          # Copy to standardized names
          cp "$TARGET_APK" build-artifacts/AYRA-AI.apk

          if [ -f "app/build/outputs/apk/debug/AYRA-AI-debug.apk" ]; then
            cp "app/build/outputs/apk/debug/AYRA-AI-debug.apk" build-artifacts/AYRA-AI-debug.apk
          else
            cp "$TARGET_APK" build-artifacts/AYRA-AI-debug.apk
          fi

          echo "APK successfully built & verified:"
          ls -lh build-artifacts/AYRA-AI.apk
          SHA256=$(sha256sum build-artifacts/AYRA-AI.apk | cut -d ' ' -f 1)
          echo "SHA256: $SHA256"
          echo "apk_size=$FILESIZE" >> $GITHUB_OUTPUT
          echo "apk_sha=$SHA256" >> $GITHUB_OUTPUT

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AYRA-AI-apk
          path: |
            build-artifacts/AYRA-AI.apk
            build-artifacts/AYRA-AI-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Calculate Incrementing Version Tag & Release Details
        id: release_meta
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")

          # 1. If triggered by git tag push (e.g. v1.0.5)
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          # 2. If manual dispatch provided custom tag
          elif [ -n "${{ github.event.inputs.custom_tag }}" ]; then
            TAG="${{ github.event.inputs.custom_tag }}"
          # 3. Dynamic incrementing semantic versioning on push to main (e.g. v1.0.0, v1.0.1, v1.0.2...)
          else
            git fetch --tags --force 2>/dev/null || true

            # Find the highest existing semver tag in the repo
            LATEST_TAG=$(git tag -l "v*.*.*" --sort=-v:refname 2>/dev/null | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)

            # Query GitHub API as fallback if local git tags are empty
            if [ -z "$LATEST_TAG" ]; then
              API_LATEST=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/${{ github.repository }}/releases/latest" 2>/dev/null | jq -r .tag_name 2>/dev/null || true)
              if [[ "$API_LATEST" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                LATEST_TAG="$API_LATEST"
              fi
            fi

            echo "Latest detected base tag: ${LATEST_TAG:-none}"

            if [[ "$LATEST_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"
              PATCH="${BASH_REMATCH[3]}"
              NEW_PATCH=$((PATCH + 1))
              CANDIDATE_TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"
            else
              MAJOR=1
              MINOR=0
              NEW_PATCH=0
              CANDIDATE_TAG="v1.0.0"
            fi

            # Ensure CANDIDATE_TAG is completely unique to prevent conflicts
            while git rev-parse -q --verify "refs/tags/$CANDIDATE_TAG" >/dev/null 2>&1 || \
                  [ "$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${{ github.repository }}/releases/tags/$CANDIDATE_TAG" 2>/dev/null)" = "200" ]; do
              echo "Tag $CANDIDATE_TAG already exists, incrementing patch version..."
              NEW_PATCH=$((NEW_PATCH + 1))
              CANDIDATE_TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"
            done

            TAG="$CANDIDATE_TAG"
          fi

          echo "Target Release Tag: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=AYRA AI Android Release $TAG" >> $GITHUB_OUTPUT
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release & Attach AYRA-AI.apk
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build-artifacts/AYRA-AI.apk
            build-artifacts/AYRA-AI-debug.apk
          name: ${{ steps.release_meta.outputs.title }}
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            ### 🚀 AYRA AI Android Release — ${{ steps.release_meta.outputs.tag }}

            **Build Details:**
            - **App Name:** `AYRA AI (آئرا AI)`
            - **Version Tag:** `${{ steps.release_meta.outputs.tag }}`
            - **Commit:** `${{ github.sha }}`
            - **Build Date:** ${{ steps.release_meta.outputs.build_date }}
            - **Direct Download:** `AYRA-AI.apk`
            - **APK SHA-256:** `${{ steps.verify_apk.outputs.apk_sha }}`

            ---

            ### 🌟 Key Features in this Build:
            - 🫧 **Floating Chat Head & Background Live Mode**: Continuous two-way conversational live chat and voice active even when other apps (WhatsApp, YouTube, Google Maps) are open and AYRA is minimized.
            - ⚡ **Real-Time Live Voice & Duplex Mode**: Automatic turn-detection, barge-in speech interruption, live scrolling transcript, and Kore female voice.
            - 👤 **Extracted Transparent 3D Rigged Avatar**: Isolated character with zero background clutter, natural breathing, eye blinking, pupil gaze tracking, and real skeletal postures (`SIT`, `STAND`, `WAVE`, `THINK`, `TALK`).
            - 👄 **Phonetic Lip-Sync System**: Real viseme mouth morphing (`A`, `E`, `O`, `U`, `M`, `F`) dynamically synchronized with spoken audio.
            - 🧠 **JARVIS-Inspired Intelligence Core**: Powered by Google Gemini AI with multi-turn conversation and persistent memory vault.
            - 🌐 **In-App Neural Web Browser**: Multi-tab browsing with AI page reader & summarizer.
            - 👁️ **Optical Camera Vision & OCR**: Live camera frame capture and gallery image analysis with OCR text extraction.
            - 🗣️ **Trilingual Polyglot Matrix**: Native comprehension and fluent generation in Urdu (اردو), English, and Hindi (हिन्दी).
            - 📱 **Mobile Subsystem Integrations**: Direct telephony (`tel:` with confirmation dialog), SMS, Alarm Scheduler, App Deep Links, and Haptic Feedback.

            ---

            ### 📲 How to Install AYRA-AI.apk on Android:
            1. Under **Assets** below, tap **`AYRA-AI.apk`** to download directly to your Android device.
            2. When downloaded, tap the APK in your notification panel or File Manager.
            3. If Android displays *"Install unknown apps"*, enable permission for your browser or file manager.
            4. Tap **Install** and open **AYRA AI**!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
