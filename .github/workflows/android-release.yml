name: MAYA AI Android Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      custom_tag:
        description: 'Custom version tag (optional, e.g. v1.0.5). Leave empty for auto-increment.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          npm ci

      - name: Compile MAYA AI Web Assets
        run: |
          npm run build
          mkdir -p app/src/main/assets/public
          cp -r dist/* app/src/main/assets/public/
          cp -r dist/* app/src/main/assets/

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK with Gradle
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate, Verify & Package MAYA-AI.apk
        id: verify_apk
        run: |
          mkdir -p build-artifacts
          OUTPUT_DIR="app/build/outputs/apk/debug"

          # Search for generated APKs
          if [ -f "$OUTPUT_DIR/MAYA-AI-debug.apk" ]; then
            TARGET_APK="$OUTPUT_DIR/MAYA-AI-debug.apk"
          elif [ -f "$OUTPUT_DIR/app-debug.apk" ]; then
            TARGET_APK="$OUTPUT_DIR/app-debug.apk"
          else
            TARGET_APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi

          if [ -z "$TARGET_APK" ] || [ ! -f "$TARGET_APK" ]; then
            echo "::error::No Android APK file found after Gradle build!"
            exit 1
          fi

          # Verify file is not empty (> 100KB)
          FILESIZE=$(stat -c%s "$TARGET_APK" 2>/dev/null || stat -f%z "$TARGET_APK" 2>/dev/null)
          if [ "$FILESIZE" -lt 100000 ]; then
            echo "::error::Generated APK is corrupt or too small ($FILESIZE bytes)!"
            exit 1
          fi

          # Standardize to MAYA-AI.apk and MAYA-AI-debug.apk
          cp "$TARGET_APK" build-artifacts/MAYA-AI.apk
          cp "$TARGET_APK" build-artifacts/MAYA-AI-debug.apk

          echo "APK successfully verified:"
          ls -lh build-artifacts/MAYA-AI.apk
          sha256sum build-artifacts/MAYA-AI.apk

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAYA-AI-apk
          path: |
            build-artifacts/MAYA-AI.apk
            build-artifacts/MAYA-AI-debug.apk
          retention-days: 30

      - name: Compute Unique Version Tag & Release Details
        id: release_meta
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          
          # If triggered by a git tag push (e.g. v1.0.5)
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          # If manual dispatch provided custom tag
          elif [ -n "${{ github.event.inputs.custom_tag }}" ]; then
            TAG="${{ github.event.inputs.custom_tag }}"
          # Default auto-increment tag for every push to main
          else
            TAG="v1.0.${{ github.run_number }}"
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=MAYA AI Android Release $TAG" >> $GITHUB_OUTPUT
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT

      - name: Create GitHub Release & Attach MAYA-AI.apk
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build-artifacts/MAYA-AI.apk
            build-artifacts/MAYA-AI-debug.apk
          name: ${{ steps.release_meta.outputs.title }}
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 🚀 MAYA AI Android Release — ${{ steps.release_meta.outputs.tag }}

            **Build Details:**
            - **Version Tag:** `${{ steps.release_meta.outputs.tag }}`
            - **Commit:** `${{ github.sha }}`
            - **Build Date:** ${{ steps.release_meta.outputs.build_date }}
            - **Package Asset:** `MAYA-AI.apk`

            ---

            ### 🌟 Key Features in this Build:
            - 🧠 **JARVIS-Inspired Assistant Core**: Powered by Google Gemini AI (`gemini-3.8-flash`) with multi-turn conversation and context memory.
            - 🎭 **7 Reactive Emotional States**: Happy 😊, Thinking 🤔, Excited 😄, Caring 💙, Confused 😕, Serious 🧠, Sad 🥺 with holographic vector lip-sync animations.
            - 🎙️ **Voice Engine HUD**: Speech-to-Text and Text-to-Speech with customizable female voice, wake-word mode ("Hey Maya"), and 60fps audio waveform.
            - 🌐 **Trilingual Polyglot Matrix**: Native comprehension and fluent generation in English, Urdu (اردو), and Hindi (हिन्दी).
            - 📱 **Mobile Subsystem Integrations**: Direct telephony (`tel:` with confirmation dialog), SMS (`sms:`), Alarm Scheduler, App Deep Links (WhatsApp, YouTube, Google Maps, Camera, Settings), and Vibration Haptics.
            - 🧰 **Productivity Tools**: Open-Meteo worldwide weather, scientific calculator with history, AI study summarizer, and encrypted memory vault.

            ---

            ### 📲 How to Install MAYA-AI.apk on Android:
            1. Under **Assets** below, tap **`MAYA-AI.apk`** to download directly to your Android device.
            2. When downloaded, tap the APK in your notification panel or File Manager.
            3. If Android displays *"Install unknown apps"*, enable permission for your browser or file manager.
            4. Tap **Install** and open **MAYA AI**!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
