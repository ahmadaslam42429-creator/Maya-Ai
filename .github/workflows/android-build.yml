name: MAYA AI Android Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish GitHub Release for this build'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Release tag name (e.g., v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          npm ci

      - name: Compile MAYA AI Web Assets
        run: |
          npm run build
          mkdir -p app/src/main/assets/public
          cp -r dist/* app/src/main/assets/public/
          cp -r dist/* app/src/main/assets/

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK with Gradle
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify and Standardize Debug APK Name
        id: verify_apk
        run: |
          mkdir -p build-artifacts
          OUTPUT_DIR="app/build/outputs/apk/debug"

          if [ -f "$OUTPUT_DIR/MAYA-AI-debug.apk" ]; then
            echo "Found MAYA-AI-debug.apk"
            cp "$OUTPUT_DIR/MAYA-AI-debug.apk" build-artifacts/MAYA-AI-debug.apk
          elif [ -f "$OUTPUT_DIR/app-debug.apk" ]; then
            echo "Renaming app-debug.apk to MAYA-AI-debug.apk"
            cp "$OUTPUT_DIR/app-debug.apk" "$OUTPUT_DIR/MAYA-AI-debug.apk"
            cp "$OUTPUT_DIR/app-debug.apk" build-artifacts/MAYA-AI-debug.apk
          else
            echo "Searching for any generated .apk..."
            FOUND_APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
            if [ -n "$FOUND_APK" ]; then
              cp "$FOUND_APK" "$OUTPUT_DIR/MAYA-AI-debug.apk"
              cp "$FOUND_APK" build-artifacts/MAYA-AI-debug.apk
            else
              echo "Error: No APK found in output directory!"
              exit 1
            fi
          fi

          echo "APK generated successfully:"
          ls -lh build-artifacts/MAYA-AI-debug.apk
          sha256sum build-artifacts/MAYA-AI-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAYA-AI-debug-apk
          path: build-artifacts/MAYA-AI-debug.apk
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          files: build-artifacts/MAYA-AI-debug.apk
          name: "MAYA AI ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.event.inputs.release_tag }}"
          tag_name: "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.event.inputs.release_tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 🚀 MAYA AI — Personal AI Assistant (Android Debug Build)

            **Features in this release:**
            - 🧠 **JARVIS-Inspired Assistant Core**: Powered by Google Gemini AI (`gemini-3.8-flash`).
            - 🎭 **Expressive Holographic Avatar**: 7 animated emotional states (Happy, Thinking, Excited, Caring, Confused, Serious, Sad).
            - 🎙️ **Voice Assistant Engine**: Full Speech-to-Text & Text-to-Speech with customizable female voice and 60fps audio waveform.
            - 🌐 **Multilingual Support**: Fluent in English, Urdu (اردو), and Hindi (हिन्दी).
            - 📱 **Native Android Mobile Subsystems**: Telephony (`tel:`), SMS (`sms:`), Alarm Scheduler, App Deep Links (WhatsApp, YouTube, Maps, Settings), and Vibration Haptics.
            - 🔒 **Security First**: Action Confirmation Modal protects sensitive device triggers.

            #### 📲 Installation Instructions:
            1. Download `MAYA-AI-debug.apk` attached below.
            2. On your Android phone, tap to install.
            3. Grant Microphone and Notification permissions when prompted.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
